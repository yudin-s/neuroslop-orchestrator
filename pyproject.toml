requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
	{ name = "Serge Judin" }
]
maintainers = [
	{ name = "Serge Judin" }
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
